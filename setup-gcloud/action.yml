name: Setup GCloud
description: Setup the GCloud CLI
author: Extenda Retail
inputs:
  service-account-key:
    description: |
      The service account key which will be used for authentication.
      The account key should be a base64 encoded JSON key stored as a secret.
    required: true
  version:
    description: Optional gcloud version to install. Defaults to 'latest'.
    required: false
    default: latest
  export-default-credentials:
    deprecationMessage: >
      This input is deprecated. The future default behavior is to always export credentials. This is
      required for gcloud interoperability with workload identity federation. The post step ensures
      that exported credentials are cleaned up after the job completes, so there are no security
      implications to always exporting credentials.
    description: |
      Export the path to the credentials as `GOOGLE_APPLICATION_CREDENTIALS` to be used in subsequent steps.
      Google Cloud CLIs and APIs will automatically use this environment variable to find credentials.
    required: false
    default: 'false'
outputs:
  project-id:
    description: The default project ID associated with the service account.
runs:
  using: node24
  main: dist/index.cjs
  post: dist/post.cjs
