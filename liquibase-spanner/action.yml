name: 'liquibase-spanner'
description: 'Validate, Prepare and Execute Liquibase CLI'
inputs:
  operation: # [update, updateCount, tag, updateToTag, rollback, rollbackCount, rollbackToDate, updateSQL, futureRollbackSQL, status, history, diff]
    description: 'Operation to run'
    required: true
  classpath: # string
    description: 'Path to Change Log directory'
    required: false
  changeLogFile: # string
    description: 'Name of Change Log File'
    required: false
  serviceAccountKey: # string
    description: 'GCloud service account key'
    required: true
  spannerExtensionUrl: # string
    description: 'Url of a spanner extension jar file'
    required: false
    default: 'https://github.com/cloudspannerecosystem/liquibase-spanner/releases/download/4.33.0.3/liquibase-spanner-4.33.0.3-all.jar'
  url: # string
    description: 'Database URL'
    required: true
  count: # integer
    description: 'Count for updateCount and rollbackCount'
    required: false
  tag: # string
    description: 'Tag for tag, updateToTag, and rollback'
    required: false
  date: # string
    description: 'Date for rollbackToDate'
    required: false
  referenceUrl: # string
    description: 'Reference URL for diff'
    required: false

runs:
  using: composite
  steps:
    - uses: extenda/actions/setup-gcloud@v0
      id: gcloud
      with:
        service-account-key: ${{ inputs.serviceAccountKey }}
        export-default-credentials: true

    - name: Build liquibase-spanner image
      shell: bash
      run: |
        docker build \
          --build-arg SPANNER_EXTENSION_URL="${{ inputs.spannerExtensionUrl }}" \
          -t liquibase-spanner:local "${{ github.action_path }}"

    - name: Run liquibase-spanner
      shell: bash
      run: |
        set -euo pipefail

        DOCKER_ARGS=(
          docker run --rm
          -v "$(pwd)":/liquibase/user
          -v "$RUNNER_TEMP":"$RUNNER_TEMP":ro
          -e GOOGLE_APPLICATION_CREDENTIALS="$GOOGLE_APPLICATION_CREDENTIALS"
          -e LIQUIBASE_COMMAND_URL="${{ inputs.url }}"
        )

        if [[ -n "${{ inputs.classpath }}" ]]; then
          DOCKER_ARGS+=(-e "LIQUIBASE_SEARCH_PATH=/liquibase/user/${{ inputs.classpath }}")
        fi

        if [[ -n "${{ inputs.changeLogFile }}" ]]; then
          DOCKER_ARGS+=(-e "LIQUIBASE_COMMAND_CHANGELOG_FILE=${{ inputs.changeLogFile }}")
        fi

        if [[ -n "${{ inputs.count }}" ]]; then
          DOCKER_ARGS+=(-e "LIQUIBASE_COMMAND_COUNT=${{ inputs.count }}")
        fi

        if [[ -n "${{ inputs.tag }}" ]]; then
          DOCKER_ARGS+=(-e "LIQUIBASE_COMMAND_TAG=${{ inputs.tag }}")
        fi

        if [[ -n "${{ inputs.date }}" ]]; then
          DOCKER_ARGS+=(-e "LIQUIBASE_COMMAND_DATE=${{ inputs.date }}")
        fi

        if [[ -n "${{ inputs.referenceUrl }}" ]]; then
          DOCKER_ARGS+=(-e "LIQUIBASE_COMMAND_REFERENCE_URL=${{ inputs.referenceUrl }}")
        fi

        DOCKER_ARGS+=(liquibase-spanner:local "${{ inputs.operation }}")

        "${DOCKER_ARGS[@]}"
